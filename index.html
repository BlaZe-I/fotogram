<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="nav-bar">
        <img src="./asset/img/fotogram.png" alt="Bild von Fotogram">
        <nav>
            <h1>Fotogram</h1>
        </nav>
    </header>

    <section class="mainone" id="main-section">

        <h2>Mein Weg in der Bundeswehr</h2>
        <div class="pictureone" id="picture">

        </div>

        <dialog id="dialog" closedby="any" class="dia">
            <img id="dialog-img" src="" alt="Bild">

             <button class="close-button" onclick="closeDialog()">X</button>
            <div class="dialog-buttons">
                <button onclick="previousPicture()">←</button>
                <button onclick="nextPicture()">→</button>
            </div>

        </dialog>

    </section>

    <footer class="footer-section">

        <div class="da">
            <img src="./asset/img/Icon.png" alt="">
            <h3>Developer <br> Akademie</h3>
        </div>
    </footer>




    <script src="sript.js"></script>
</body>

</html>
